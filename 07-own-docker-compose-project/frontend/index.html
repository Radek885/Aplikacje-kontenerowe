<!DOCTYPE html>
<html>
<head>
    <title>ToDo Multi-Container</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <h2 class="text-center">ToDo App</h2>
        <div class="input-group mb-3">
            <input id="taskInput" class="form-control" placeholder="Nowe zadanie">
            <button onclick="addTask()" class="btn btn-primary">Dodaj</button>
        </div>
        <div id="taskList" class="list-group shadow-sm"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
